# Render blueprint for the IdeaForge API (frontend deploys separately to Vercel).
services:
  - type: web
    name: ideaforge-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: mongodb+srv://adityasinghas0608_db_user:OsCm4qurO5IviIx5@cluster0.abtxsnv.mongodb.net/ideaforge?retryWrites=true&w=majority&appName=Cluster0
      - key: CLIENT_URL
        value: https://*.vercel.app
      - key: AI_PROVIDER
        value: fallback
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
